name: OneTurn
options:
  bundleIdPrefix: eu.alpineops
  deploymentTarget:
    iOS: "15.0"
targets:
  OneTurn:
    type: application
    platform: iOS
    sources: [OneTurn]
    info:
      path: OneTurn/Info.plist
      properties:
        CFBundleDisplayName: OneTurn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        NSLocationWhenInUseUsageDescription: OneTurn shows where you are on the map and guides you along your route.
        # Only this site opens inside the app. It also lets the app keep its own offline copy (service worker).
        WKAppBoundDomains:
          - alpineops.eu
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.alpineops.oneturn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

name: Build IPA

# Builds an unsigned OneTurn.ipa on every push to main (or by hand from the Actions tab).
# AltStore signs it with your own Apple ID when you install it on the iPhone.
on:
  push:
    branches: [main]
    paths: ['OneTurn/**', 'project.yml', '.github/workflows/build.yml']   # only when the app itself changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project OneTurn.xcodeproj -target OneTurn -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Pack OneTurn.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/OneTurn.app out/Payload/
          cd out && zip -qry OneTurn.ipa Payload && ls -l OneTurn.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OneTurn-ipa
          path: out/OneTurn.ipa

      - name: Publish as a release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" out/OneTurn.ipa --latest \
            --title "OneTurn 1.2 (${{ github.run_number }})" \
            --notes "Unsigned build for AltStore. Install: open this file on the iPhone, share it to AltStore."

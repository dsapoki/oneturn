name: Swiss CHAdeMO chargers

# Every night: all public CHAdeMO stations in Switzerland from the federal open data, JOYA marked,
# saved as data/ch-chademo.json for the web app. Commits only when something changed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ch_chademo.py
      - name: Save if the stations changed
        run: |
          if git show HEAD:data/ch-chademo.json > /tmp/old.json 2>/dev/null && python3 -c "import json,sys; a=json.load(open('/tmp/old.json')).get('stations'); b=json.load(open('data/ch-chademo.json'))['stations']; sys.exit(0 if a == b else 1)"; then echo "no change"; exit 0; fi
          git add data/ch-chademo.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Swiss CHAdeMO chargers: daily update"
          git push
